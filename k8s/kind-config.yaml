# kind create cluster --name retailflow --config k8s/kind-config.yaml
kind: Cluster
apiVersion: kind.x-k8s.io/v1alpha4
nodes:
  - role: control-plane
    extraPortMappings:
      - { containerPort: 30443, hostPort: 30443, listenAddress: "127.0.0.1" }   # Kong HTTPS gateway
      - { containerPort: 30300, hostPort: 30300, listenAddress: "127.0.0.1" }   # Grafana
