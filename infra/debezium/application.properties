# Debezium Server: log-based Change Data Capture (CDC) for the Order Service
# transactional outbox. It tails the MySQL binlog for inserts into
# orders.outbox and publishes each row to RabbitMQ. Order Service never talks
# to the broker itself, so "save the order" and "announce the order" cannot
# get out of step: if the transaction commits the event is published,
# if it rolls back there is no binlog entry and no event.

# ---- Sink: RabbitMQ topic exchange, routing key = event type ----
debezium.sink.type=rabbitmq
debezium.sink.rabbitmq.connection.host=${RABBITMQ_HOST:rabbitmq}
debezium.sink.rabbitmq.connection.port=5672
debezium.sink.rabbitmq.connection.username=${RABBITMQ_APP_USER}
debezium.sink.rabbitmq.connection.password=${RABBITMQ_APP_PASSWORD}
debezium.sink.rabbitmq.connection.virtual.host=retailflow
debezium.sink.rabbitmq.exchange=retailflow.events
debezium.sink.rabbitmq.routingKeyFromTopicName=true
debezium.sink.rabbitmq.autoCreateRoutingKey=false
debezium.sink.rabbitmq.deliveryMode=2

# ---- Source: MySQL binlog ----
debezium.source.connector.class=io.debezium.connector.mysql.MySqlConnector
debezium.source.database.hostname=${MYSQL_HOST:order-db}
debezium.source.database.port=3306
debezium.source.database.user=debezium
debezium.source.database.password=${MYSQL_DEBEZIUM_PASSWORD}
debezium.source.database.server.id=184054
debezium.source.topic.prefix=orderdb
debezium.source.database.include.list=orders
debezium.source.table.include.list=orders.outbox
debezium.source.snapshot.mode=no_data
debezium.source.tombstones.on.delete=false
debezium.source.offset.storage.file.filename=data/offsets.dat
debezium.source.offset.flush.interval.ms=0
debezium.source.schema.history.internal=io.debezium.storage.file.history.FileSchemaHistory
debezium.source.schema.history.internal.file.filename=data/schema-history.dat

# ---- Outbox Event Router SMT ----
# The "type" column (e.g. order.created) becomes the topic name, which the
# sink then uses as the RabbitMQ routing key. The JSON payload column is the
# message body.
debezium.transforms=outbox
debezium.transforms.outbox.type=io.debezium.transforms.outbox.EventRouter
debezium.transforms.outbox.route.by.field=type
debezium.transforms.outbox.route.topic.replacement=\\${routedByValue}
debezium.transforms.outbox.table.field.event.key=aggregateid
debezium.transforms.outbox.table.expand.json.payload=true

debezium.format.value=json
debezium.format.value.schemas.enable=false
debezium.format.key=json
debezium.format.key.schemas.enable=false

quarkus.log.console.json=true
quarkus.log.level=INFO
