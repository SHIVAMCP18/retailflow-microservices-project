syntax = "proto3";
package product;
option java_multiple_files = true;
option java_package = "com.retailflow.product.grpc";

// Synchronous call used by Order Service while placing an order.
service ProductStock {
  // Atomically checks and decrements stock for every line of an order.
  rpc ReserveStock (ReserveRequest) returns (ReserveReply);
}
message ReserveItem { int64 product_id = 1; int32 quantity = 2; }
message ReserveRequest { string order_id = 1; repeated ReserveItem items = 2; }
message ReservedLine { int64 product_id = 1; string name = 2; double unit_price = 3; int32 quantity = 4; }
message ReserveReply { bool success = 1; string message = 2; repeated ReservedLine lines = 3; }
