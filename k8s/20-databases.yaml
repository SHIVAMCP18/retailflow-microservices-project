# Database per service: each database is only reachable from its owning
# service (see 50-network-policies.yaml) and keeps its data on a PersistentVolume.
---
apiVersion: apps/v1
kind: StatefulSet
metadata: { name: product-db, namespace: retailflow, labels: { app: product-db } }
spec:
  serviceName: product-db
  replicas: 1
  selector: { matchLabels: { app: product-db } }
  template:
    metadata: { labels: { app: product-db } }
    spec:
      automountServiceAccountToken: false
      containers:
        - name: postgres
          image: postgres:16-alpine
          env:
            - { name: POSTGRES_DB, value: products }
            - { name: POSTGRES_USER, value: product_app }
            - { name: POSTGRES_PASSWORD, valueFrom: { secretKeyRef: { name: app-secrets, key: POSTGRES_PASSWORD } } }
            - { name: PGDATA, value: /var/lib/postgresql/data/pgdata }
          ports: [{ containerPort: 5432 }]
          volumeMounts: [{ name: data, mountPath: /var/lib/postgresql/data }]
          readinessProbe: { exec: { command: ["pg_isready", "-U", "product_app", "-d", "products"] }, periodSeconds: 5 }
          resources: { requests: { cpu: 50m, memory: 128Mi }, limits: { memory: 512Mi } }
  volumeClaimTemplates:
    - metadata: { name: data }
      spec: { accessModes: [ReadWriteOnce], resources: { requests: { storage: 1Gi } } }
---
apiVersion: v1
kind: Service
metadata: { name: product-db, namespace: retailflow }
spec: { selector: { app: product-db }, ports: [{ port: 5432 }] }
---
apiVersion: apps/v1
kind: StatefulSet
metadata: { name: customer-db, namespace: retailflow, labels: { app: customer-db } }
spec:
  serviceName: customer-db
  replicas: 1
  selector: { matchLabels: { app: customer-db } }
  template:
    metadata: { labels: { app: customer-db } }
    spec:
      automountServiceAccountToken: false
      containers:
        - name: mongo
          image: mongo:7
          env:
            - { name: MONGO_INITDB_ROOT_USERNAME, value: customer_app }
            - { name: MONGO_INITDB_ROOT_PASSWORD, valueFrom: { secretKeyRef: { name: app-secrets, key: MONGO_PASSWORD } } }
          ports: [{ containerPort: 27017 }]
          volumeMounts: [{ name: data, mountPath: /data/db }]
          readinessProbe: { exec: { command: ["mongosh", "--quiet", "--eval", "db.runCommand({ ping: 1 })"] }, periodSeconds: 10, timeoutSeconds: 5 }
          resources: { requests: { cpu: 50m, memory: 256Mi }, limits: { memory: 768Mi } }
  volumeClaimTemplates:
    - metadata: { name: data }
      spec: { accessModes: [ReadWriteOnce], resources: { requests: { storage: 1Gi } } }
---
apiVersion: v1
kind: Service
metadata: { name: customer-db, namespace: retailflow }
spec: { selector: { app: customer-db }, ports: [{ port: 27017 }] }
---
apiVersion: apps/v1
kind: StatefulSet
metadata: { name: order-db, namespace: retailflow, labels: { app: order-db } }
spec:
  serviceName: order-db
  replicas: 1
  selector: { matchLabels: { app: order-db } }
  template:
    metadata: { labels: { app: order-db } }
    spec:
      automountServiceAccountToken: false
      containers:
        - name: mysql
          image: mysql:8.0
          envFrom: [{ secretRef: { name: app-secrets } }]
          ports: [{ containerPort: 3306 }]
          volumeMounts:
            - { name: data, mountPath: /var/lib/mysql }
            - { name: init, mountPath: /docker-entrypoint-initdb.d }
          readinessProbe:
            exec: { command: ["sh", "-c", "mysqladmin ping -h 127.0.0.1 -uroot -p\"$MYSQL_ROOT_PASSWORD\" --silent"] }
            initialDelaySeconds: 20
            periodSeconds: 5
          resources: { requests: { cpu: 100m, memory: 384Mi }, limits: { memory: 1Gi } }
      volumes:
        - { name: init, configMap: { name: order-db-init } }
  volumeClaimTemplates:
    - metadata: { name: data }
      spec: { accessModes: [ReadWriteOnce], resources: { requests: { storage: 1Gi } } }
---
apiVersion: v1
kind: Service
metadata: { name: order-db, namespace: retailflow }
spec: { selector: { app: order-db }, ports: [{ port: 3306 }] }
---
apiVersion: apps/v1
kind: StatefulSet
metadata: { name: notification-db, namespace: retailflow, labels: { app: notification-db } }
spec:
  serviceName: notification-db
  replicas: 1
  selector: { matchLabels: { app: notification-db } }
  template:
    metadata: { labels: { app: notification-db } }
    spec:
      automountServiceAccountToken: false
      containers:
        - name: redis
          image: redis:7-alpine
          command: ["sh", "-c", "exec redis-server --appendonly yes --requirepass \"$REDIS_PASSWORD\""]
          env:
            - { name: REDIS_PASSWORD, valueFrom: { secretKeyRef: { name: app-secrets, key: REDIS_PASSWORD } } }
          ports: [{ containerPort: 6379 }]
          volumeMounts: [{ name: data, mountPath: /data }]
          readinessProbe: { exec: { command: ["sh", "-c", "redis-cli -a \"$REDIS_PASSWORD\" --no-auth-warning ping | grep PONG"] }, periodSeconds: 5 }
          resources: { requests: { cpu: 25m, memory: 32Mi }, limits: { memory: 256Mi } }
  volumeClaimTemplates:
    - metadata: { name: data }
      spec: { accessModes: [ReadWriteOnce], resources: { requests: { storage: 512Mi } } }
---
apiVersion: v1
kind: Service
metadata: { name: notification-db, namespace: retailflow }
spec: { selector: { app: notification-db }, ports: [{ port: 6379 }] }
