# RetailFlow - microservices demo. Start everything with:
#   cp .env.example .env && docker compose up --build
# Only the gateway and the admin dashboards are published, and only on
# 127.0.0.1, so nothing is reachable from other machines on your network.
name: retailflow

x-service: &service
  restart: unless-stopped
  networks: [retailflow]
  environment: &service-env
    CONSUL_HTTP_ADDR: http://consul:8500
  logging:
    driver: json-file
    options: { max-size: 10m, max-file: "3" }

# Every service may read the JWT *public* key (to verify tokens), nothing else.
x-public-key: &public-key
  type: volume
  source: secrets
  target: /run/secrets
  read_only: true
  volume: { subpath: public }

services:
  # ---------------------------------------------------------------- bootstrap
  secrets-init:
    image: alpine/openssl:3.3.2
    entrypoint: ["sh", "/generate.sh"]
    volumes:
      - ./infra/secrets/generate.sh:/generate.sh:ro
      - secrets:/out
    networks: [retailflow]

  rabbitmq-init:
    image: curlimages/curl:8.10.1
    entrypoint: ["sh", "/init-topology.sh"]
    environment:
      RABBITMQ_ADMIN_USER: ${RABBITMQ_ADMIN_USER}
      RABBITMQ_ADMIN_PASSWORD: ${RABBITMQ_ADMIN_PASSWORD}
      RABBITMQ_APP_USER: ${RABBITMQ_APP_USER}
      RABBITMQ_APP_PASSWORD: ${RABBITMQ_APP_PASSWORD}
    volumes: ["./infra/rabbitmq/init-topology.sh:/init-topology.sh:ro"]
    depends_on: { rabbitmq: { condition: service_healthy } }
    networks: [retailflow]

  order-db-init:   # creates the orders schema and the order_app / debezium users (idempotent)
    image: mysql:8.0
    entrypoint: ["bash", "/init/01-order-schema.sh"]
    environment:
      MYSQL_HOST: order-db
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      MYSQL_ORDER_PASSWORD: ${MYSQL_ORDER_PASSWORD}
      MYSQL_DEBEZIUM_PASSWORD: ${MYSQL_DEBEZIUM_PASSWORD}
    volumes: ["./infra/mysql:/init:ro"]
    depends_on: { order-db: { condition: service_healthy } }
    networks: [retailflow]

  # ---------------------------------------------------------- infrastructure
  consul:
    <<: *service
    image: hashicorp/consul:1.19
    command: agent -dev -ui -client=0.0.0.0 -log-json
    ports: ["127.0.0.1:8500:8500"]
    networks:
      # Fixed address because Kong needs an IP for its DNS resolver.
      retailflow: { ipv4_address: 172.30.0.53 }
    healthcheck:
      test: ["CMD", "consul", "members"]
      interval: 5s
      retries: 10

  rabbitmq:
    <<: *service
    image: rabbitmq:3.13-management-alpine
    hostname: rabbitmq
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_ADMIN_USER}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_ADMIN_PASSWORD}
    ports: ["127.0.0.1:15672:15672"]
    volumes:
      - rabbitmq-data:/var/lib/rabbitmq
      - ./infra/rabbitmq/20-prometheus.conf:/etc/rabbitmq/conf.d/20-prometheus.conf:ro
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "check_port_connectivity"]
      interval: 5s
      timeout: 10s
      retries: 20

  kong:
    <<: *service
    image: kong:3.9
    entrypoint: ["sh", "/kong/render-and-start.sh"]
    environment:
      KONG_DATABASE: "off"
      KONG_PROXY_LISTEN: "0.0.0.0:8443 ssl http2"
      KONG_SSL_CERT: /run/tls/tls.crt
      KONG_SSL_CERT_KEY: /run/tls/tls.key
      KONG_ADMIN_LISTEN: "off"
      KONG_STATUS_LISTEN: "0.0.0.0:8100"
      KONG_DNS_RESOLVER: "172.30.0.53:8600"
      KONG_DNS_ORDER: "SRV,A"
      KONG_HEADERS: "off"
      KONG_PROXY_ACCESS_LOG: /dev/stdout
      KONG_PROXY_ERROR_LOG: /dev/stderr
    ports: ["127.0.0.1:8443:8443"]
    volumes:
      - ./infra/kong:/kong:ro
      - *public-key
      - { type: volume, source: secrets, target: /run/tls, read_only: true, volume: { subpath: gateway } }
    depends_on:
      secrets-init: { condition: service_completed_successfully }
      consul: { condition: service_healthy }
    healthcheck:
      test: ["CMD", "kong", "health"]
      interval: 10s
      retries: 10

  debezium:
    <<: *service
    image: debezium/server:2.7.3.Final
    environment:
      RABBITMQ_APP_USER: ${RABBITMQ_APP_USER}
      RABBITMQ_APP_PASSWORD: ${RABBITMQ_APP_PASSWORD}
      MYSQL_DEBEZIUM_PASSWORD: ${MYSQL_DEBEZIUM_PASSWORD}
    volumes:
      - ./infra/debezium/application.properties:/debezium/conf/application.properties:ro
      - debezium-data:/debezium/data
    depends_on:
      order-db-init: { condition: service_completed_successfully }
      rabbitmq-init: { condition: service_completed_successfully }

  mailpit:   # fake SMTP server with a web inbox for the e-mail notifications
    <<: *service
    image: axllent/mailpit:v1.21
    ports: ["127.0.0.1:8025:8025"]

  # --------------------------------------------- databases (one per service)
  product-db:
    <<: *service
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: products
      POSTGRES_USER: product_app
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes: ["product-data:/var/lib/postgresql/data"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U product_app -d products"]
      interval: 5s
      retries: 20

  customer-db:
    <<: *service
    image: mongo:7
    environment:
      MONGO_INITDB_ROOT_USERNAME: customer_app
      MONGO_INITDB_ROOT_PASSWORD: ${MONGO_PASSWORD}
    volumes: ["customer-data:/data/db"]
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.runCommand({ ping: 1 })"]
      interval: 5s
      retries: 20

  order-db:
    <<: *service
    image: mysql:8.0
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      MYSQL_ORDER_PASSWORD: ${MYSQL_ORDER_PASSWORD}
      MYSQL_DEBEZIUM_PASSWORD: ${MYSQL_DEBEZIUM_PASSWORD}
    volumes: ["order-data:/var/lib/mysql"]
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -uroot -p\"$$MYSQL_ROOT_PASSWORD\" --silent"]
      interval: 5s
      retries: 30

  notification-db:
    <<: *service
    image: redis:7-alpine
    command: ["sh", "-c", "exec redis-server --appendonly yes --requirepass \"$$REDIS_PASSWORD\""]
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD}
    volumes: ["notification-data:/data"]
    healthcheck:
      test: ["CMD-SHELL", "redis-cli -a \"$$REDIS_PASSWORD\" --no-auth-warning ping | grep PONG"]
      interval: 5s
      retries: 20

  # ------------------------------------------------------ business services
  product-service:     # Node.js + PostgreSQL, REST + gRPC server
    <<: *service
    build: ./product-service
    image: retailflow/product-service:1.0
    environment:
      <<: *service-env
      DATABASE_URL: postgresql://product_app:${POSTGRES_PASSWORD}@product-db:5432/products
    volumes: [*public-key]
    depends_on:
      product-db: { condition: service_healthy }
      secrets-init: { condition: service_completed_successfully }
      consul: { condition: service_healthy }

  customer-service:    # Python + MongoDB, also the JWT issuer
    <<: *service
    build: ./customer-service
    image: retailflow/customer-service:1.0
    environment:
      <<: *service-env
      MONGO_URL: mongodb://customer_app:${MONGO_PASSWORD}@customer-db:27017/?authSource=admin
      RABBITMQ_URL: amqp://${RABBITMQ_APP_USER}:${RABBITMQ_APP_PASSWORD}@rabbitmq:5672/retailflow
      ADMIN_EMAIL: ${ADMIN_EMAIL}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD}
    volumes:
      - { type: volume, source: secrets, target: /run/secrets, read_only: true, volume: { subpath: issuer } }
    depends_on:
      customer-db: { condition: service_healthy }
      rabbitmq-init: { condition: service_completed_successfully }
      secrets-init: { condition: service_completed_successfully }
      consul: { condition: service_healthy }

  order-service:       # Java + MySQL, gRPC/REST client, outbox + CQRS
    <<: *service
    build: ./order-service
    image: retailflow/order-service:1.0
    environment:
      <<: *service-env
      CONSUL_HOST: consul
      MYSQL_ORDER_PASSWORD: ${MYSQL_ORDER_PASSWORD}
      RABBITMQ_APP_USER: ${RABBITMQ_APP_USER}
      RABBITMQ_APP_PASSWORD: ${RABBITMQ_APP_PASSWORD}
    volumes: [*public-key]
    depends_on:
      order-db-init: { condition: service_completed_successfully }
      rabbitmq-init: { condition: service_completed_successfully }
      secrets-init: { condition: service_completed_successfully }
      consul: { condition: service_healthy }

  billing-service:     # Go + SQLite (file database inside its own volume)
    <<: *service
    build: ./billing-service
    image: retailflow/billing-service:1.0
    environment:
      <<: *service-env
      RABBITMQ_URL: amqp://${RABBITMQ_APP_USER}:${RABBITMQ_APP_PASSWORD}@rabbitmq:5672/retailflow
    volumes: [*public-key, "billing-data:/data"]
    depends_on:
      rabbitmq-init: { condition: service_completed_successfully }
      secrets-init: { condition: service_completed_successfully }
      consul: { condition: service_healthy }

  notification-service:  # C# + Redis, e-mail via Mailpit
    <<: *service
    build: ./notification-service
    image: retailflow/notification-service:1.0
    environment:
      <<: *service-env
      REDIS_HOST: notification-db:6379
      REDIS_PASSWORD: ${REDIS_PASSWORD}
      RABBITMQ_URL: amqp://${RABBITMQ_APP_USER}:${RABBITMQ_APP_PASSWORD}@rabbitmq:5672/retailflow
      SMTP_HOST: mailpit
      SMTP_PORT: "1025"
    volumes: [*public-key]
    depends_on:
      notification-db: { condition: service_healthy }
      rabbitmq-init: { condition: service_completed_successfully }
      secrets-init: { condition: service_completed_successfully }
      consul: { condition: service_healthy }

  web-ui:   # React website, served by nginx and routed by Kong at https://localhost:8443/
    <<: *service
    build: ./web-ui
    image: retailflow/web-ui:1.0
    depends_on:
      consul: { condition: service_healthy }

  # ------------------------------------------------- monitoring and logging
  prometheus:
    <<: *service
    image: prom/prometheus:v2.54.1
    command: ["--config.file=/etc/prometheus/prometheus.yml", "--web.enable-lifecycle"]
    ports: ["127.0.0.1:9090:9090"]
    volumes: ["./infra/prometheus:/etc/prometheus:ro"]
    depends_on: [consul]

  loki:
    <<: *service
    image: grafana/loki:3.2.1
    command: ["-config.file=/etc/loki/loki.yml"]
    volumes: ["./infra/loki/loki.yml:/etc/loki/loki.yml:ro", "loki-data:/loki"]

  promtail:   # ships every container's stdout to Loki
    <<: *service
    image: grafana/promtail:3.2.1
    command: ["-config.file=/etc/promtail/promtail.yml"]
    volumes:
      - ./infra/promtail/promtail.yml:/etc/promtail/promtail.yml:ro
      - /var/run/docker.sock:/var/run/docker.sock:ro
    depends_on: [loki]

  grafana:
    <<: *service
    image: grafana/grafana:11.3.0
    environment:
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD}
      GF_USERS_ALLOW_SIGN_UP: "false"
      GF_DASHBOARDS_DEFAULT_HOME_DASHBOARD_PATH: /var/lib/grafana/dashboards/retailflow.json
    ports: ["127.0.0.1:3000:3000"]
    volumes:
      - ./infra/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./infra/grafana/dashboards:/var/lib/grafana/dashboards:ro
    depends_on: [prometheus, loki]

networks:
  retailflow:
    ipam:
      config: [{ subnet: 172.30.0.0/24 }]

volumes:
  secrets:
  rabbitmq-data:
  debezium-data:
  product-data:
  customer-data:
  order-data:
  billing-data:
  notification-data:
  loki-data:
